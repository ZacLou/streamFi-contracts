# cargo-deny configuration
#
# Run locally: cargo deny check
# CI runs: cargo deny check licenses advisories

[graph]
targets = [
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Allow common open-source licenses used by the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # `unicode-ident` (pulled in transitively via syn/proc-macro deps) moved
    # to this license in its 1.0.13+ releases.
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# No crate bans configured yet; the goal is license/advisory checking.
multiple-versions = "warn"
wildcards = "allow"
